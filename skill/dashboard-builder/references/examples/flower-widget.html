<!doctype html>
<html lang="ko">
<head>
<style>
  :root { --bg: transparent; --ink: #2e221c; --muted: #86695a; --accent: #c4562f; --pop: #6a4c93; --line: #ecd9ca; --raised: #fffdfb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--ink); background: var(--bg); }
  .wrap { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
  .big { font-size: 44px; font-weight: 700; line-height: 1; color: var(--accent); }
  .label { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .bars { margin-top: 16px; display: grid; gap: 8px; }
  .bar { display: grid; grid-template-columns: 70px 1fr 28px; align-items: center; gap: 8px; font-size: 12px; }
  .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }
  h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); background: var(--raised); border-radius: 6px; margin-bottom: 6px; }
  li b { font-weight: 600; } li span { color: var(--muted); white-space: nowrap; }
  li.soon { border-color: var(--pop); } li.soon span { color: var(--pop); font-weight: 600; }
  .empty { color: var(--muted); padding: 10px 0; }
  @media (max-width: 560px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <section>
    <div class="big" id="open">–</div>
    <div class="label" id="openLabel">이번 주 남은 꽃다발</div>
    <div class="bars" id="bars"></div>
  </section>
  <section>
    <h3>다가오는 픽업 · 기념일 (7일)</h3>
    <ul id="soon"><li class="empty">불러오는 중…</li></ul>
  </section>
</div>
<script>
  // 대시보드 앱이 넣어 주는 데이터: { name, week, colors, menus[], records{}, agents[] }
  const DAY = 86400000
  function daysUntil(value, yearly) {
    if (!value) return null
    const now = new Date(); now.setHours(0, 0, 0, 0)
    let date = new Date(value); if (Number.isNaN(date.getTime())) return null
    date.setHours(0, 0, 0, 0)
    if (yearly) { date.setFullYear(now.getFullYear()); if (date < now) date.setFullYear(now.getFullYear() + 1) }
    return Math.round((date - now) / DAY)
  }
  function render(data) {
    const c = data.colors || {}
    for (const [k, v] of Object.entries({ ink: c.ink, muted: c.muted, accent: c.accent, pop: c.pop, line: c.border, raised: c.raised })) if (v) document.documentElement.style.setProperty('--' + k, v)
    const menu = data.menus.find(m => m.key === 'c-bouquet')
    const orders = data.records['c-bouquet'] || []
    const open = orders.filter(o => o.status !== 'done' && o.status !== 'rejected')
    document.getElementById('open').textContent = open.length
    const labels = menu ? menu.statusLabels : {}
    const steps = ['open', 'working', 'waiting', 'done']
    const max = Math.max(1, ...steps.map(s => orders.filter(o => (o.status || 'open') === s).length))
    document.getElementById('bars').innerHTML = steps.map(s => {
      const n = orders.filter(o => (o.status || 'open') === s).length
      return `<div class="bar"><span>${labels[s] || s}</span><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><b>${n}</b></div>`
    }).join('')
    const soon = [
      ...open.map(o => ({ title: o.title, who: o.person, d: daysUntil(o.dueAt), kind: '픽업' })),
      ...(data.records['c-regulars'] || []).map(r => ({ title: r.title, who: r.person, d: daysUntil(r.date, true), kind: '기념일' })),
    ].filter(x => x.d !== null && x.d >= 0 && x.d <= 7).sort((a, b) => a.d - b.d).slice(0, 5)
    const esc = s => String(s || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]))
    document.getElementById('soon').innerHTML = soon.length
      ? soon.map(x => `<li class="${x.d <= 1 ? 'soon' : ''}"><b>${esc(x.kind)} · ${esc(x.who || x.title)}</b><span>${x.d === 0 ? '오늘' : x.d === 1 ? '내일' : x.d + '일 뒤'}</span></li>`).join('')
      : '<li class="empty">7일 안에 픽업·기념일이 없어요.</li>'
    parent.postMessage({ type: 'dashboard:height', height: document.body.scrollHeight + 8 }, '*')
  }
  addEventListener('message', e => { if (e.data && e.data.type === 'dashboard:data') render(e.data.data) })
  parent.postMessage({ type: 'dashboard:ready' }, '*')
</script>
</body>
</html>
